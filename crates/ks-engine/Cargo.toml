[package]
name = "ks-engine"
version = "0.1.0"
edition = "2021"
description = "内核哨兵 - 用户态检测引擎"

[dependencies]
ks-core = { path = "../ks-core" }
# ks-ebpf 是纯 C 项目，eBPF 字节码由 build.rs 编译
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
sha2 = "0.10"
flate2 = "1"
aya = "0.14"
aya-obj = "0.3"
aya-log = "0.2"

[build-dependencies]
which = "7"

[dev-dependencies]
tempfile = "3"
