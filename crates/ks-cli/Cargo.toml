[package]
name = "ks-cli"
version = "0.1.0"
edition = "2021"
description = "内核哨兵 - 命令行工具"

[[bin]]
name = "kernelsentinel"
path = "src/main.rs"

[dependencies]
ks-engine = { path = "../ks-engine" }
ks-core = { path = "../ks-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
