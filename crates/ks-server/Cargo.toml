[package]
name = "ks-server"
version = "0.1.0"
edition = "2021"
description = "内核哨兵 - REST API + WebSocket 数据服务"

[lib]
name = "ks_server"
path = "src/lib.rs"

[[bin]]
name = "ks-server-bin"
path = "src/main.rs"

[dependencies]
ks-core = { path = "../ks-core" }
# Phase E1.2：ServerState 持有 Arc<dyn BpfMapReader + Send + Sync>，
# 需要从 ks-engine 引入 BpfMapReader trait。
ks-engine = { path = "../ks-engine" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
# F3 可观测性: Prometheus 指标 + tracing 结构化日志（tracing-log 桥接保留 log::info! 兼容）
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-log = "0.2"
once_cell = "1"

# F4 安全加固: TLS 双向认证 / API 鉴权 / 速率限制 / 审计日志
# rustls 0.23 默认 feature 含 aws-lc-rs（需要 cmake/cc）；改用 ring 后端保证跨平台编译。
# axum-server 用 tls-rustls-no-provider，避免被强制启用 aws-lc-rs（与 ring 冲突）。
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tower_governor = "0.4"
governor = "0.6"
sha2 = "0.10"
# F4 auth/audit 中间件需要 axum 的 middleware feature
axum-extra = { version = "0.9", features = ["typed-header"] }

[dev-dependencies]
# Phase E1.3：集成测试用 tower::ServiceExt::oneshot 直接调用 axum Router
tower = { version = "0.5", features = ["util"] }
