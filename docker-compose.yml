# ==========================================================================
# 内核哨兵 (KernelSentinel) — 生产部署 Compose
# ==========================================================================
#
# 启动:
#   docker compose up -d
#
# 仅 ks-server (核心):
#   docker compose up -d ks-server
#
# 含监控栈 (可选 prometheus):
#   docker compose --profile metrics up -d
#
# 前提:
#   - eBPF 加载需 privileged + 宿主 /sys/fs/bpf 已挂载 (type bpf)
#   - KS_AUTH_TOKEN 建议放入 .env 文件 (compose 自动读取)
#       echo "KS_AUTH_TOKEN=$(openssl rand -hex 32)" > .env
#
# 注: ks-frontend / nginx 前端服务已移除（申报书不涉及Web前端）。
#     历史痕迹见 git log。如需恢复前端反代，请在独立分支维护。
# ==========================================================================

services:
  # ────────────────────────────────────────────────────────────────────────
  # ks-server: eBPF 探针 + REST API + WebSocket
  # ────────────────────────────────────────────────────────────────────────
  ks-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: kernelsentinel:latest
    container_name: ks-server
    # eBPF 需要 CAP_BPF/CAP_PERFMON/CAP_SYS_ADMIN + 访问 /sys/fs/bpf、/proc
    # 生产可改用 cap_add 列表，但部分老内核 (3.10) 仍需 privileged
    privileged: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - /proc:/proc
      - /lib/modules:/lib/modules:ro
      - ./rules:/etc/kernelsentinel/rules:ro
    environment:
      # REST API 鉴权 token (从 .env 读取，未设置则关闭鉴权)
      KS_AUTH_TOKEN: ${KS_AUTH_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-info}
    # 入口脚本做前置检查后 exec kernelsentinel start --serve 8080 ...
    command: ["--serve", "8080", "--rules-dir", "/etc/kernelsentinel/rules"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ────────────────────────────────────────────────────────────────────────
  # prometheus: 指标采集 (可选，--profile metrics 启用)
  # ────────────────────────────────────────────────────────────────────────
  # 注: nginx 前端反代服务已移除（申报书不涉及Web前端），历史痕迹见 git log。
  prometheus:
    image: prom/prometheus:latest
    container_name: ks-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - metrics
    depends_on:
      - ks-server
