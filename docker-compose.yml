services:
  ks-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: kernelsentinel:latest
    container_name: ks-server
    privileged: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - /proc:/proc
      - /lib/modules:/lib/modules:ro
      - ./rules:/etc/kernelsentinel/rules:ro
    environment:
      KS_AUTH_TOKEN: ${KS_AUTH_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-info}
    command: ["--rules-dir", "/etc/kernelsentinel/rules", "--log-dir", "/var/log/kernelsentinel"]
    healthcheck:
      # root 运行时状态文件在 /run/kernelsentinel/，非 root 回退 /tmp
      test: ["CMD", "bash", "-c", "test -f /run/kernelsentinel/ks-status.json || test -f /tmp/ks-status.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: ks-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - metrics
    depends_on:
      - ks-server
