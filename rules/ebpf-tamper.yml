# ebpf-tamper.yml — 本文件规则均未声明 enforce，阻断模式下只告警不实杀（severity 仅决定告警级别）。
- name: "eBPF 程序篡改检测"
  description: "检测 BPF 程序被卸载/篡改 (event_type=82, 探针: kprobe/security_bpf_prog_free)"
  severity: critical
  conditions:
    - field: event_type
      operator: equals
      value: "82"
    - field: comm
      operator: regex
      value: "(bpftool|rmmod|systemd|kill|bpftool_rls)"
  alert_message: "检测到 eBPF 程序被篡改/卸载，疑似防御规避 (Impair Defenses)"
  mitre_tactic: "TA0005"
  mitre_technique: "T1562"
