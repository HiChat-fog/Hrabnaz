# lkm-load.yml — 本文件规则均未声明 enforce，阻断模式下只告警不实杀（severity 仅决定告警级别）。
- name: "LKM Rootkit 加载检测"
  description: "检测加载可疑内核模块 (rootkit/backdoor/nf_hook) (event_type=81, 探针: kprobe/do_init_module)"
  severity: critical
  conditions:
    - field: event_type
      operator: equals
      value: "81"
    - field: comm
      operator: regex
      value: "(insmod|modprobe)"
    - field: module_name
      operator: regex
      value: "(rootkit|backdoor|nf_hook)"
  alert_message: "检测到可疑内核模块加载 (rootkit/backdoor/nf_hook)，疑似 Rootkit 安装"
  mitre_tactic: "TA0003"
  mitre_technique: "T1547.006"

- name: "LKM 普通模块加载"
  description: "检测加载普通内核模块 (非 rootkit/backdoor/nf_hook) (event_type=81)"
  severity: low
  conditions:
    - field: event_type
      operator: equals
      value: "81"
    - field: comm
      operator: regex
      value: "(insmod|modprobe)"
  alert_message: "检测到内核模块加载操作 (普通模块)"
  mitre_tactic: "TA0003"
  mitre_technique: "T1547.006"
