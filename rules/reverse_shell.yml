# reverse_shell.yml — 本文件规则均未声明 enforce，阻断模式下只告警不实杀（severity 仅决定告警级别）。
- name: "反弹Shell检测"
  description: "检测通过 bash/zsh -i、/dev/tcp、python pty 建立的反弹 Shell 连接"
  severity: critical
  conditions:
    - field: comm
      operator: regex
      value: "(bash|zsh|python[23]?|perl|ruby)"
    - field: args
      operator: regex
      value: "(-i|/dev/tcp|/dev/udp|pty\\.spawn|import pty|socket\\.socket)"
  alert_message: "检测到反弹 Shell 行为: 进程试图建立交互式反向连接"
  mitre_tactic: "TA0002"
  mitre_technique: "T1059.004"

- name: "Netcat反弹Shell"
  description: "检测 nc/ncat 建立的反弹 Shell"
  severity: critical
  conditions:
    - field: comm
      operator: regex
      value: "(nc|ncat|netcat)"
    - field: args
      operator: regex
      value: "(-e|-c)"
  alert_message: "检测到 nc -e/-c 反弹 Shell 行为"
  mitre_tactic: "TA0002"
  mitre_technique: "T1059"
