# credential-access.yml — 本文件规则均未声明 enforce，阻断模式下只告警不实杀（severity 仅决定告警级别）。
# 凭据访问检测 — 打开事件仅对内核 infer_sensitive_file 的 4 个敏感前缀放行，
# 非 root 家目录下的私钥打开事件会被智能过滤丢弃（已知传感器边界）

- name: "gshadow凭据文件访问"
  description: "对 /etc/gshadow 的访问（内核风险加成 35，open 事件可放行）"
  severity: high
  conditions:
    - field: filename
      operator: contains
      value: "/etc/gshadow"
  alert_message: "检测到 /etc/gshadow 凭据文件访问，疑似凭证窃取"
  mitre_tactic: "TA0006"
  mitre_technique: "T1003.008"

- name: "SSH私钥文件访问"
  description: "按 SSH 私钥的通用位置与命名判定：id_rsa/id_ed25519/id_ecdsa、ssh_host_*_key、.ssh/ 下的 .pem/.key；证书目录与 .pub 不匹配"
  severity: high
  conditions:
    # sshd 读取主机私钥用于握手，属本职行为
    - field: comm
      operator: not_regex
      value: "^sshd$"
    - field: filename
      operator: regex
      value: "(id_rsa|id_ed25519|id_ecdsa|ssh_host_[^/]+_key)$|/\\.ssh/[^/]+\\.(pem|key)$"
  alert_message: "检测到 SSH 私钥文件访问，疑似凭证窃取"
  mitre_tactic: "TA0006"
  mitre_technique: "T1552.004"
