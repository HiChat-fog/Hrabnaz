# 凭据访问检测 — 打开事件仅对内核 infer_sensitive_file 的 4 个敏感前缀放行，
# 非 root 家目录下的私钥打开事件会被智能过滤丢弃（已知传感器边界）

- name: "gshadow凭据文件访问"
  description: "对 /etc/gshadow 的访问（内核风险加成 35，open 事件可放行）"
  severity: high
  conditions:
    - field: filename
      operator: contains
      value: "/etc/gshadow"
  alert_message: "检测到 /etc/gshadow 凭据文件访问，疑似凭证窃取"
  mitre_tactic: "TA0006"
  mitre_technique: "T1003.008"

- name: "SSH私钥文件访问"
  description: "对 id_rsa/id_ed25519/id_ecdsa/.pem 私钥文件的访问（root 家目录下的 open 事件可放行；其他路径依赖 >=1024B 写事件）"
  severity: high
  conditions:
    - field: filename
      operator: regex
      value: "(id_rsa|id_ed25519|id_ecdsa|\\.pem)$"
  alert_message: "检测到 SSH 私钥文件访问，疑似凭证窃取"
  mitre_tactic: "TA0006"
  mitre_technique: "T1552.004"
