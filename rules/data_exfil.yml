# data_exfil.yml — 本文件规则均未声明 enforce，阻断模式下只告警不实杀（severity 仅决定告警级别）。
- name: "敏感日志文件访问"
  description: "检测对系统日志目录的异常访问 (可能为数据窃取做准备)"
  severity: medium
  conditions:
    - field: filename
      operator: regex
      value: "^/var/log/(auth|secure|syslog|audit)"
    # 日志采集/审计守护进程读日志是本职行为：按 comm 豁免，避免常态刷屏。
    # comm 来自内核 task->comm，16 字节截断，故按截断后的名字匹配。
    - field: comm
      operator: not_regex
      value: "^(rsyslogd|systemd-journal|journald|imjournal|in:imjournal|auditd|AliYunDunMonito|AliYunDun)$"
  alert_message: "检测到对安全相关日志文件的访问，可能为数据窃取做准备"
  mitre_tactic: "TA0010"
  mitre_technique: "T1005"

- name: "非私有IP外连高危端口"
  description: "检测向非私有 IP 的高危端口建立连接 (可能的数据外传通道)"
  severity: high
  conditions:
    - field: daddr
      operator: not_regex
      value: "^(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|127\\.|0\\.0\\.0\\.0)"
    - field: dport
      operator: regex
      value: "^(4444|1337|31337|5555|6666|6667|9999)$"
  alert_message: "检测到向外部可疑端口建立连接，可能为数据外传通道"
  mitre_tactic: "TA0010"
  mitre_technique: "T1041"

- name: "大文件外传可疑连接"
  description: "检测大文件写入后向外部非私有 IP 建立连接的行为 (单事件维度)"
  severity: high
  conditions:
    - field: file_bytes
      operator: gt
      value: "1048576"
    - field: daddr
      operator: not_regex
      value: "^(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|127\\.|0\\.0\\.0\\.0)"
  alert_message: "检测到大于 1MB 的文件写入同时有外部网络连接，疑似数据外传"
  mitre_tactic: "TA0010"
  mitre_technique: "T1048"
