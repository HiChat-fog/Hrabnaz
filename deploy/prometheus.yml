global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'kernelsentinel-monitor'

scrape_configs:
  - job_name: 'kernelsentinel'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'ks-server:8080'
        labels:
          service: 'ks-server'
          component: 'ebpf-detector'

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'
