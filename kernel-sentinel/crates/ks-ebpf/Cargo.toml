[package]
name = "ks-ebpf"
version = "0.1.0"
edition = "2021"
description = "内核哨兵 - eBPF 探针程序 (纯 C 项目，由 build.rs 编译)"

# ks-ebpf 是纯 C 项目，不在 workspace 中。
# build.rs 使用 clang 编译 .bpf.c 文件为 .o 字节码，
# Rust 依赖仅用于 build 阶段的工具链检测。

[build-dependencies]
which = "4"

# 注: aya-ebpf 和 ks-core 依赖已移除。
# ks-ebpf 不包含任何 Rust 源代码 (src/lib.rs 或 src/main.rs)，
# 这些依赖在运行时不会被使用。
# aya-ebpf: eBPF C 代码不使用 aya-ebpf 的 Rust 绑定，
#           字节码 (.o) 在运行时由 ks-engine 的 loader 加载。
# ks-core:  C 代码直接定义结构体 (common.h)，不依赖 Rust 端定义。