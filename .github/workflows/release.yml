name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install llvm-18 / clang-18 / libelf-dev (for eBPF build.rs)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y libelf-dev libbpf-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p ks-cli --target ${{ matrix.target }}

      - name: Package release archive
        run: |
          STAGING="staging"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/kernelsentinel" "$STAGING/"
          cp -r rules "$STAGING/"
          cp -r scripts "$STAGING/"
          cp README.md "$STAGING/"
          ARCHIVE="kernelsentinel-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "$STAGING" .
          echo "=== Archive contents ==="
          tar tzf "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: kernelsentinel-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
